<script>
{

const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const PAYM=[['نقدي','نقدي'],['تحويل بنكي','تحويل بنكي'],['شبكة / مدى','شبكة / مدى'],['شيك','شيك'],['آجل','آجل']];

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((+x||0)*100)/100;
const fmt=x=>(+x||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const qf=x=>(+x||0).toLocaleString('en-US',{maximumFractionDigits:3});
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+(+n||0));return d.toISOString().slice(0,10)};
const dBetween=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const list=c=>Object.values(S[c]);

const cfg=()=>({logo:DEFAULT_LOGO,vatRate:15,invPrefix:'INV-',quoPrefix:'QUO-',purPrefix:'PUR-',payDays:30,quoteDays:15,cur:'ر.س',...S.settings});
const U={q:'',st:'all',from:today().slice(0,8)+'01',to:today()};

/* ---------- الحسابات ---------- */
const lineNet=it=>r2((+it.qty||0)*(+it.price||0)-(+it.disc||0));
function totals(d){const rate=(d.vatRate??cfg().vatRate)/100;let g=0,ds=0;(d.items||[]).forEach(it=>{g+=(+it.qty||0)*(+it.price||0);ds+=(+it.disc||0)});const net=r2(g-ds),vat=r2(net*rate);return{gross:r2(g),disc:r2(ds),net,vat,total:r2(net+vat)}}
const paid=d=>r2(sum(d.payments||[],p=>p.amount));
const due=d=>d.status==='void'?0:r2(totals(d).total-paid(d));
function invSt(d){if(d.status==='void')return['ملغاة','void'];const t=totals(d).total,p=paid(d);if(t>0&&p>=t-.005)return['مدفوعة','ok'];if(d.due&&d.due<today())return[p>0?'متأخرة · جزئي':'متأخرة','bad'];return[p>0?'مدفوعة جزئيًا':'غير مدفوعة','warn']}
const QST={draft:'مسودة',sent:'مُرسَل',accepted:'مقبول',rejected:'مرفوض',converted:'حُوِّل لفاتورة'};
function quoSt(d){if(d.status==='converted')return[QST.converted,'ok'];if(d.status==='accepted')return[QST.accepted,'ok'];if(d.status==='rejected')return[QST.rejected,'void'];if(d.valid&&d.valid<today())return['منتهي الصلاحية','bad'];return[QST[d.status]||'مسودة','warn']}
function stock(){const m={};list('products').forEach(p=>{if(p.type!=='service')m[p.id]=+p.open||0});
  const mv=(col,sg)=>list(col).forEach(d=>d.status!=='void'&&(d.items||[]).forEach(it=>{if(it.pid in m)m[it.pid]+=sg*(+it.qty||0)}));
  mv('purchases',1);mv('invoices',-1);list('adjustments').forEach(a=>{if(a.pid in m)m[a.pid]+=+a.qty||0});return m}
function nextNo(col,pre){let mx=0;list(col).forEach(d=>{const m=String(d.no||'').match(/(\d+)\s*$/);if(m)mx=Math.max(mx,+m[1])});return pre+String(mx+1).padStart(4,'0')}
function partyOf(col,d){const pc=col==='purchases'?'suppliers':'customers';const live=S[pc][d.partyId];return live||d.party||{name:col==='purchases'?'—':'عميل نقدي'}}
const chip=([t,c])=>`<span class="chip ${c}">${esc(t)}</span>`;

/* ---------- التخزين ---------- */
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function dbErr(e){const c=e&&e.code;return /permission/.test(c)?'لا تملك صلاحية لهذا الإجراء':/quota/.test(c)?'تجاوزت حصة قاعدة البيانات':/resource/.test(c)?'طلبات كثيرة، أعد المحاولة بعد لحظات':'تعذّر الحفظ، تحقق من الاتصال وأعد المحاولة'}
async function put(col,id,data,quiet){const body=JSON.parse(JSON.stringify(data));delete body.id;if(ME){body.updatedAt=new Date().toISOString();body.updatedBy=ME.email}
  if(!db){if(col==='settings')S.settings=body;else S[col][id]={...body,id};persist();schedule();return}
  for(let a=0;;a++){try{await db.doc(col+'/'+id).set(body);return}catch(e){const c=e&&e.code;if(a<3&&/unavailable|resource/.test(c||'')){await new Promise(r=>setTimeout(r,(/resource/.test(c)?1500:500)*(a+1)+Math.random()*400));continue}if(!quiet)toast(dbErr(e),1);throw e}}}
async function del(col,id){if(!db){delete S[col][id];persist();schedule();return}
  try{await db.doc(col+'/'+id).delete()}catch(e){toast(dbErr(e),1);throw e}}
function banner(t){$('#banner').textContent=t}
let ME=null,ROLE='viewer',unsubs=[],USERS={},idleT=null;
const RL={admin:'مدير',accountant:'محاسب',viewer:'مشاهد'};
const ADMINV=['setup','import','users'];
function fbErr(e){const c=(e&&e.code)||'';return({'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/wrong-password':'البريد أو كلمة المرور غير صحيحة','auth/user-not-found':'البريد أو كلمة المرور غير صحيحة','auth/invalid-login-credentials':'البريد أو كلمة المرور غير صحيحة','auth/too-many-requests':'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة','auth/network-request-failed':'لا يوجد اتصال بالإنترنت','auth/email-already-in-use':'هذا البريد مسجّل لحساب آخر','auth/weak-password':'كلمة المرور ضعيفة — 6 أحرف على الأقل','auth/invalid-email':'البريد الإلكتروني غير صحيح','auth/user-disabled':'هذا الحساب معطّل','permission-denied':'لا تملك صلاحية لهذا الإجراء'})[c]||('خطأ: '+(c||(e&&e.message)||''))}
function gateMsg(t){$('#gate-msg').textContent=t}
function showGate(){$('#gate').hidden=false;document.body.classList.add('lock')}
function hideGate(){$('#gate').hidden=true;gateMsg('');document.body.classList.remove('lock')}
function applyRole(){document.body.classList.toggle('ro',ROLE==='viewer');document.body.classList.toggle('nadm',ROLE!=='admin');document.querySelectorAll('[data-nav]').forEach(a=>a.hidden=ADMINV.includes(a.dataset.nav)&&ROLE!=='admin');route()}
function stopData(){unsubs.forEach(f=>{try{f()}catch(_){}});unsubs=[];COLS.forEach(c=>S[c]={});S.settings={};USERS={};ME=null;ROLE='viewer';mode='loading';clearTimeout(idleT);closeModal();$('#ask').hidden=true;banner('');schedule()}
function bump(){clearTimeout(idleT);if(ME)idleT=setTimeout(()=>{firebase.auth().signOut();gateMsg('تم تسجيل خروجك تلقائيًا بعد '+(window.IDLE_MINUTES||10)+' دقائق من عدم النشاط.')},(window.IDLE_MINUTES||10)*6e4)}
['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,bump,{passive:true}));
function startData(){const timer=setTimeout(()=>{if(mode==='loading')banner('تعذّر الوصول إلى البيانات حتى الآن. تحقق من الاتصال بالإنترنت.')},10000);
  let left=COLS.length+1;const ready=()=>{if(--left===0){clearTimeout(timer);mode='db';banner('')}};
  const onErr=e=>{clearTimeout(timer);banner('تعذّر تحميل البيانات: '+fbErr(e))};
  let f0=0;unsubs.push(db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};if(!f0&&!s.metadata.fromCache){f0=1;ready()}schedule()},onErr));
  COLS.forEach(c=>{let f=0;unsubs.push(db.collection(c).onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]={...d.data(),id:d.id});S[c]=o;if(!f&&!q.metadata.fromCache){f=1;ready()}schedule()},onErr))});
  if(ROLE==='admin')unsubs.push(db.collection('users').onSnapshot(q=>{USERS={};q.docs.forEach(d=>USERS[d.id]={...d.data(),id:d.id});schedule()},()=>{}));
  bump()}
async function init(){const C=window.FIREBASE_CONFIG||{};showGate();$('#gate-logo').src=DEFAULT_LOGO;
  if(!C.apiKey||!C.projectId){gateMsg('لم تُضبط إعدادات Firebase بعد: الصق إعدادات مشروعك في FIREBASE_CONFIG أعلى ملف index.html.');$('#loginf button[type=submit]').disabled=true;return}
  if(typeof firebase==='undefined'){gateMsg('تعذّر تحميل مكتبات Firebase — تحقق من الاتصال بالإنترنت ثم حدّث الصفحة.');return}
  firebase.initializeApp(C);db=firebase.firestore();
  $('#loginf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;gateMsg('جارٍ الدخول…');try{await firebase.auth().signInWithEmailAndPassword($('#lg-email').value.trim(),$('#lg-pass').value)}catch(err){gateMsg(fbErr(err))}b.disabled=false};
  $('#lg-forgot').onclick=async e=>{e.preventDefault();const em=$('#lg-email').value.trim();if(!em){gateMsg('اكتب بريدك أولًا ثم اضغط «نسيت كلمة المرور».');return}try{await firebase.auth().sendPasswordResetEmail(em);gateMsg('أُرسل رابط تعيين كلمة المرور إلى بريدك.')}catch(err){gateMsg(fbErr(err))}};
  firebase.auth().onAuthStateChanged(async u=>{stopData();if(!u){showGate();return}
    try{const ref=db.doc('users/'+u.uid);let s=await ref.get();
      if(!s.exists&&window.ADMIN_EMAIL&&(u.email||'').toLowerCase()===String(window.ADMIN_EMAIL).trim().toLowerCase()){await ref.set({name:'المدير',email:u.email,role:'admin',active:true,createdAt:new Date().toISOString()});s=await ref.get()}
      const d=s.exists?s.data():null;
      if(!d||d.active!==true){gateMsg(!d?'هذا الحساب غير مضاف إلى البرنامج. اطلب من المدير إضافتك.':'حسابك موقوف. راجع المدير.');await firebase.auth().signOut();return}
      ME={uid:u.uid,email:u.email,...d};ROLE=RL[d.role]?d.role:'viewer';hideGate();applyRole();startData()}
    catch(err){gateMsg('تعذّر التحقق من الحساب — '+fbErr(err));await firebase.auth().signOut()}})}
function vUsers(){if(ROLE!=='admin')return'';const all=Object.values(USERS).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));
  const body=all.map(u=>{const self=u.id===ME?.uid;return`<tr><td><b>${esc(u.name||'')}</b>${self?' <span class="chip">أنت</span>':''}</td><td dir="ltr" style="text-align:start">${esc(u.email)}</td><td><select data-urole="${u.id}" ${self?'disabled':''} aria-label="الصلاحية" style="width:auto">${Object.entries(RL).map(([k,l])=>`<option value="${k}"${u.role===k?' selected':''}>${l}</option>`).join('')}</select></td><td>${chip(u.active?['فعّال','ok']:['موقوف','void'])}</td><td>${self?'':`<button class="btn sm ghost" data-act="toggleUser" data-id="${u.id}">${u.active?'إيقاف':'تفعيل'}</button>`}</td></tr>`});

function vReports(){const c=cfg(),from=U.from,to=U.to,inR=x=>x>=from&&x<=to,t=today();

  <div class="grid2"><div class="panel"><h3>قائمة الدخل</h3><table class="pl">${L('صافي المبيعات',rev)}${L('تكلفة البضاعة المباعة',-cogs)}${L('مجمل الربح',gp,'sep')}${Object.entries(cats).map(([k,v])=>L('مصروف: '+esc(k),-v)).join('')}${L('صافي الربح',np,'sep')}</table><p class="hint">التكلفة محسوبة بسعر تكلفة الصنف وقت إصدار الفاتورة.</p></div>
  <div class="panel"><h3>إقرار ضريبة القيمة المضافة</h3><table class="pl"><tr><td>المبيعات الخاضعة للضريبة</td><td class="num">${fmt(rev)}</td></tr>${L('ضريبة المخرجات',vOut)}<tr><td>المشتريات الخاضعة للضريبة</td><td class="num">${fmt(pNet)}</td></tr>${L('ضريبة مدخلات المشتريات',-pVat)}<tr><td>المصروفات الخاضعة للضريبة</td><td class="num">${fmt(eNet)}</td></tr>${L('ضريبة مدخلات المصروفات',-eVat)}${L(vNet>=0?'صافي الضريبة المستحقة':'رصيد ضريبي لصالحك',vNet,'sep')}</table><p class="hint">للمراجعة قبل تقديم الإقرار على بوابة هيئة الزكاة والضريبة والجمارك.</p></div></div>
  <div class="grid2 mt"><div class="panel"><h3>أعمار ذمم العملاء (حتى اليوم)</h3><table class="pl">${L('غير مستحقة بعد',ag[0])}${L('متأخرة 1–30 يومًا',ag[1])}${L('31–60 يومًا',ag[2])}${L('61–90 يومًا',ag[3])}${L('أكثر من 90 يومًا',ag[4])}${L('الإجمالي',sum(ag,x=>x),'sep')}</table></div>

  if(!hasV){if(net&&tot)vat=tot-net;else if(net)vat=net*rate;else if(tot){net=tot/(1+rate);vat=tot-net}}else if(!net&&tot)net=tot-vat;
  if(!tot)tot=net+vat;net=r2(net);vat=r2(vat);let rt=net?r2(vat/net*100):cfg().vatRate;if(Math.abs(rt-15)<.5)rt=15;else if(Math.abs(rt)<.05)rt=0;return{net,vat,tot:r2(tot),rate:rt}}

  if(T==='products'){const ty=NZ(gv(r,'type')),svc=ty.includes('خدم')||ty.includes('service');return{name:gs(r,'name'),code:AD(gs(r,'code')),type:svc?'service':'goods',unit:gs(r,'unit')||'حبة',cost:num(gv(r,'cost')),price:num(gv(r,'price')),open:svc?0:num(gv(r,'open')),min:num(gv(r,'min'))}}
  if(T==='expenses'){const m=money(r,'amount');return{date:toDate(gv(r,'date')),category:gs(r,'category')||'أخرى',desc:gs(r,'desc'),amount:m.net,vat:m.vat,ref:AD(gs(r,'ref')),method:'نقدي'}}

  if(IM.map.paid>=0)pd=num(gv(r,'paid'));else if(IM.map.remain>=0)pd=m.tot-num(gv(r,'remain'));else pd=(st.includes('مدفوع')||st==='paid')&&!st.includes('غير')&&!st.includes('جزئ')?m.tot:0;

async function imRun(){if(IM.busy)return;const T=IM.type,rows=IM.rows.map(imRow);IM.busy=true;IM.res='';schedule();let add=0,skip=0,err=0,np=0,ob=0,i=0;
  const key=x=>NZ(x).replace(/\s+/g,' ');const now=new Date().toISOString();
  const P=(T==='purchases'||T==='suppliers')?'suppliers':'customers',pmap={};list(P).forEach(p=>pmap[key(p.name)]=p);
  const go=async(col,id,d)=>{try{await put(col,id,d,1);return 1}catch(e){err++;if(e&&/quota/.test(e.code||''))throw e;return 0}};
  try{for(const x of rows){if(++i%15===0)toast(`جارٍ الاستيراد… ${i} / ${rows.length}`);
    if(T==='customers'||T==='suppliers'){if(!x.name||pmap[key(x.name)]){skip++;continue}const id=uid(),{balance,...p}=x;if(!await go(T,id,p))continue;pmap[key(x.name)]={...p,id};add++;
      if(balance){const dc=T==='customers'?'invoices':'purchases';ob++;await go(dc,uid(),{no:'افتتاحي-'+String(ob).padStart(4,'0'),date:IM.date,due:IM.date,partyId:id,party:{name:p.name,vat:p.vat,cr:p.cr,address:p.address,phone:p.phone},items:[{pid:'',name:balance>0?'رصيد افتتاحي منقول من قيود':'رصيد دائن منقول من قيود',qty:1,price:balance,disc:0}],notes:'',vatRate:0,payments:[],status:'issued',ts:now,opening:true,imported:'qoyod'})}}
    else if(T==='products'){const ex=list('products').find(p=>(x.code&&p.code===x.code)||key(p.name)===key(x.name));if(!x.name||ex||pmap['p:'+(x.code||key(x.name))]){skip++;continue}pmap['p:'+(x.code||key(x.name))]=1;if(await go('products',uid(),x))add++}
    else if(T==='expenses'){if(!x.date||!(x.amount||x.vat)){skip++;continue}const k='e:'+x.date+x.amount+x.desc+x.ref;if(pmap[k]||list('expenses').some(e=>e.date===x.date&&+e.amount===x.amount&&(e.desc||'')===x.desc&&(e.ref||'')===x.ref)){skip++;continue}pmap[k]=1;if(await go('expenses',uid(),x))add++}
    else{if(!x.date||!(x.tot||x.net)){skip++;continue}const no=x.no||nextNo(T,T==='purchases'?cfg().purPrefix:cfg().invPrefix);if(pmap['d:'+no]||list(T).some(d=>String(d.no).trim()===no)){skip++;continue}pmap['d:'+no]=1;
      let pid='';if(x.party){let p=pmap[key(x.party)];if(!p){const id=uid();p={name:x.party,id};if(await go(P,id,{name:x.party})){pmap[key(x.party)]=p;np++}else p=null}pid=p?p.id:''}
      const p=pid?pmap[key(x.party)]:null;
      const d={no,date:x.date,due:x.due,partyId:pid,party:p?{name:p.name||'',vat:p.vat||'',cr:p.cr||'',address:p.address||'',phone:p.phone||''}:(x.party?{name:x.party}:null),items:[{pid:'',name:(T==='purchases'?'فاتورة مشتريات':'فاتورة')+' منقولة من قيود'+(x.desc?' — '+x.desc:''),qty:1,price:x.net,disc:0}],notes:'',vatRate:x.rate,payments:x.paid?[{date:x.date,amount:x.paid,method:'منقول من قيود'}]:[],status:x.void?'void':'issued',ts:x.date+'T09:00:00Z',imported:'qoyod'};
      if(T==='purchases')d.ref=no;if(await go(T,uid(),d))add++}}}
  catch(e){IM.res=`<b>توقف الاستيراد:</b> امتلأت مساحة البيانات بعد ${add} سجل.`}
  IM.busy=false;IM.res=IM.res||`<b>اكتمل الاستيراد:</b> أُضيف ${add} سجل إلى ${IMF[T].t}${skip?` · تُخطي ${skip} (موجود مسبقًا أو ناقص)`:''}${np?` · أُنشئ ${np} ${P==='customers'?'عميل':'مورد'} جديد`:''}${ob?` · ${ob} رصيد افتتاحي`:''}${err?` · <span style="color:var(--brickink)">تعذّر حفظ ${err}</span>`:''}.`;toast('اكتمل الاستيراد');schedule()}
async function setLogo(file){if(!file)return;if(file.size>8e6){toast('الصورة كبيرة جدًا',1);return}const url=URL.createObjectURL(file);const img=new Image();
  img.onload=async()=>{URL.revokeObjectURL(url);const sc=Math.min(1,600/img.naturalWidth,240/img.naturalHeight);const w=Math.max(1,Math.round(img.naturalWidth*sc)),h=Math.max(1,Math.round(img.naturalHeight*sc));const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    let d=cv.toDataURL('image/png');if(d.length>180000)d=cv.toDataURL('image/webp',.9);if(d.length>180000){toast('الشعار كبير جدًا، جرّب صورة أصغر',1);return}

$('#view').addEventListener('submit',async e=>{if(e.target.id!=='setf')return;e.preventDefault();const f=new FormData(e.target),o={...S.settings};for(const[k,v]of f.entries())o[k]=['vatRate','payDays','quoteDays'].includes(k)?(+v||0):String(v).trim();
  if(o.vat&&!/^3\d{13}3$/.test(o.vat))toast('تنبيه: الرقم الضريبي السعودي 15 رقمًا يبدأ وينتهي بـ 3');try{await put('settings','main',o);setTimeout(()=>toast('حُفظت الإعدادات'),o.vat&&!/^3\d{13}3$/.test(o.vat)?2700:0);document.activeElement.blur();schedule()}catch(_){}});
$('#view').addEventListener('change',e=>{const t=e.target;if(t.dataset.urole){db.doc('users/'+t.dataset.urole).update({role:t.value}).then(()=>toast('تم تغيير الصلاحية')).catch(err=>toast(fbErr(err),1));return}if(t.id==='im-file'){t.files[0]&&imFile(t.files[0]);t.value='';return}if(t.id==='logo-in'){setLogo(t.files[0]);t.value='';return}if(t.id==='im-sheet'){imSheet(t.value);return}if(t.dataset.im){IM.map[t.dataset.im]=+t.value;schedule();return}if(t.dataset.imd){IM.date=t.value;return}if(e.target.id!=='imp')return;const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(_){toast('الملف غير صالح',1);return}
  const n=COLS.reduce((s,c)=>s+Object.keys(o[c]||{}).length,0);ask(`سيُستورد ${n} سجلًا${o.settings?' مع الإعدادات':''}. متابعة؟`,async()=>{let i=0;try{if(o.settings&&Object.keys(o.settings).length)await put('settings','main',o.settings);for(const c of COLS)for(const[id,v]of Object.entries(o[c]||{})){await put(c,id,v);if(++i%20===0)toast(`جارٍ الاستيراد… ${i} / ${n}`)}toast('اكتمل الاستيراد: '+i+' سجل')}catch(_){}},'استيراد')};rd.readAsText(file);e.target.value=''});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ask').hidden){$('#ask').hidden=true}});

route();init();
}
